{% extends "layout.html" %}

{% block content %}
<h1>Editar Médico</h1>

<form method="POST">

    <label>Nombre:</label>
    <input type="text" name="nombre" value="{{ medico.nombre }}" required>

    <button type="submit">Guardar cambios</button>
</form>

<a href="{{ url_for('listar_medicos') }}">Volver</a>
{% endblock %}
