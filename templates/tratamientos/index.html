{% extends "layout.html" %}

{% block content %}
<h1>Lista de Tratamientos</h1>

<a href="{{ url_for('crear_tratamiento') }}">Crear tratamiento</a>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Tratamiento</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>
        {% for tratamiento in tratamientos %}
        <tr>
            <td>{{ tratamiento.id }}</td>
            <td>{{ tratamiento.nombre }}</td>
            <td>
                <a href="{{ url_for('editar_tratamiento', id=tratamiento.id) }}">Editar</a>

                <form action="{{ url_for('eliminar_tratamiento', id=tratamiento.id) }}" method="POST" style="display:inline;">
                    <button type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
