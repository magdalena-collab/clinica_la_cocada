<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión de Usuarios{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav class="navbar">
            <h1 class="logo">Sistema MVC</h1>
            <ul>
                <li><a href="{{ url_for('usuario.index') }}">Inicio</a></li>
                <li><a href="{{ url_for('usuario.crear') }}">Nuevo Usuario</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 - Proyecto MVC Flask</p>
    </footer>
</body>
</html>
